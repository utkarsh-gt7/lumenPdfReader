version: '3.8'

services:
  pdf-reader:
    build:
      context: .
      dockerfile: Dockerfile
    image: pdf-reader:latest
    container_name: pdf-reader
    ports:
      - '8080:80'
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost/']
      interval: 30s
      timeout: 3s
      retries: 3
