sonar.projectKey=pdf-reader
sonar.organization=your-org
sonar.projectName=Lumen PDF Reader
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**
sonar.exclusions=node_modules/**,dist/**,coverage/**,docs/**,public/**,**/*.config.*

sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.exclusions=src/test/**,src/main.tsx,**/*.d.ts,src/types/**,src/vite-env.d.ts

sonar.sourceEncoding=UTF-8
